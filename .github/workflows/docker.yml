name: Docker images
on:
  push:
    branches: [main]
    tags: ['v*']
env:
  REGISTRY: ghcr.io
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { name: api, file: deploy/Dockerfile.api, context: . }
          - { name: web, file: deploy/Dockerfile.web, context: . }
          - { name: worker, file: deploy/Dockerfile.worker, context: . }
          - { name: analytics, file: services/analytics/Dockerfile, context: services/analytics }
          - { name: audit-gateway, file: services/audit-gateway/Dockerfile, context: services/audit-gateway }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/your-org/clearpath-${{ matrix.name }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
