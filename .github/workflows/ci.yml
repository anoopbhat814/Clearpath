name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: clearpath, POSTGRES_PASSWORD: clearpath, POSTGRES_DB: clearpath }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clearpath" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://clearpath:clearpath@localhost:5432/clearpath
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build
  analytics:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/analytics } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
  gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/audit-gateway } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: go vet ./...
      - run: go test -race ./...
