name: Migrations check
on:
  pull_request:
    paths: ['prisma/**']
jobs:
  drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: clearpath, POSTGRES_PASSWORD: clearpath, POSTGRES_DB: clearpath }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clearpath" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://clearpath:clearpath@localhost:5432/clearpath
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: Fail on schema drift
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
