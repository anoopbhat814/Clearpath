apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearpath-api
  labels: { app: clearpath-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: clearpath-api }
  template:
    metadata:
      labels: { app: clearpath-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/clearpath-api:1.4.0
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: clearpath-config }
            - secretRef: { name: clearpath-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: clearpath-api
spec:
  selector: { app: clearpath-api }
  ports: [{ port: 4000, targetPort: 4000 }]
