apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearpath-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: clearpath-worker }
  template:
    metadata:
      labels: { app: clearpath-worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/clearpath-worker:1.4.0
          envFrom:
            - configMapRef: { name: clearpath-config }
            - secretRef: { name: clearpath-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
