apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearpath-analytics
  labels: { app: clearpath-analytics }
spec:
  replicas: 2
  selector:
    matchLabels: { app: clearpath-analytics }
  template:
    metadata:
      labels: { app: clearpath-analytics }
    spec:
      containers:
        - name: analytics
          image: ghcr.io/your-org/clearpath-analytics:1.4.0
          ports: [{ containerPort: 8100 }]
          envFrom:
            - configMapRef: { name: clearpath-config }
            - secretRef: { name: clearpath-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8100 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8100 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: clearpath-analytics
spec:
  selector: { app: clearpath-analytics }
  ports: [{ port: 8100, targetPort: 8100 }]
