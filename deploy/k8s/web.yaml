apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearpath-web
  labels: { app: clearpath-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: clearpath-web }
  template:
    metadata:
      labels: { app: clearpath-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/clearpath-web:1.4.0
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: clearpath-config }
            - secretRef: { name: clearpath-secrets }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: clearpath-web
spec:
  selector: { app: clearpath-web }
  ports: [{ port: 3000, targetPort: 3000 }]
